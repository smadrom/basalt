version: 2
updates:
  # Policy: minor/patch updates arrive grouped weekly. Majors are NOT ignored —
  # they arrive as their own PRs (outside the groups) and are reviewed individually.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
